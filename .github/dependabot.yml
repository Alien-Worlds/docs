version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Docusaurus packages must move in lockstep; separate PRs would each
      # fail the build on version skew between core and the plugins.
      docusaurus:
        patterns:
          - '@docusaurus/*'
          - 'docusaurus-*'
      dev-tooling:
        patterns:
          - 'prettier'
          - 'typescript'
          - '@types/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
